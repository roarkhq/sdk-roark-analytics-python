name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  review:
    if: |
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      !startsWith(github.head_ref, 'release-please--') &&
      github.head_ref != 'next'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # The review compares the regenerated output against the previous
          # generation, so it needs history, not just the PR snapshot.
          fetch-depth: 0

      - name: PR Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Bot-authored PRs are skipped unless the bot is allow-listed here.
          allowed_bots: "stainless-app"
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This repository is the generated Python SDK for the Roark API.
            Almost every file in it is emitted by the generator in
            roarkhq/app-agent-codegen from the OpenAPI spec at
            https://api.roark.ai/doc. The generator's own parser, naming,
            emitter and deletion rules, with their fixtures and snapshots, live
            in that repo and are reviewed there. You are reviewing the output
            and the release metadata, not the generator. Do not score or block
            this PR on generator internals you cannot see from here.

            Read the whole diff before writing anything. These PRs are small; a
            partial review is not useful. If you genuinely cannot read part of
            it, name the files you skipped and why.

            First decide which kind of PR this is.

            **A. Regeneration PR** - opened by the codegen automation from the
            `automation/api-update` branch, with a generator-written body, and a
            diff confined to `src/roark_analytics/resources/`,
            `src/roark_analytics/types/`, `tests/api_resources/`, `api.md` and
            `.stats.yml`. Every file was rewritten wholesale, so review the API
            surface delta, not the file list.

            1. **API surface and release metadata (highest priority)**
               - For each type the PR body lists as removed, decide from the
                 diff whether it is a real loss of API surface or a
                 generator-side rename of a nested model. Compare the removed
                 class with the added ones field by field: an identical body
                 under a new name (`FooHandler` to
                 `FooHandlerUnionMember0`, or a dedup rename) breaks imports of
                 that nested name but removes no capability. State which it is
                 in one line, and whether the commit title's `feat!:` or a
                 `BREAKING CHANGE:` footer matches that conclusion. Claiming a
                 break that is not there and missing one that is are both
                 findings.
               - Do not stop at the types the body lists. Variant names are
                 positional, so inserting a union member mid-list renumbers
                 every name after it: the name survives and its schema changes
                 under it. The body's surface diff compares name sets, so this
                 shows up as nothing removed and one `...UnionMemberN` added
                 with the highest N. Whenever you see that, walk the whole
                 union: for every `...UnionMemberN` class in the diff, pair its
                 `type` literal before and after. Report each name whose
                 discriminator moved, with the before and after value. This
                 breaks consumers more quietly than a removal - imports keep
                 working, an `isinstance` branch silently starts matching a
                 different variant - so it belongs in the breaking-change call
                 and in the `BREAKING CHANGE:` footer even though no gate
                 flagged it.
               - Check each added or removed field against the spec change it
                 implies: Python name against the camelCase `alias`, `Optional`
                 with a default for optional fields, `Literal` members, and
                 `Required[...]` in the `*_param.py` twin.
               - Check a response model and its `*_param.py` twin stay in sync,
                 and that the sync and async resource classes get the same
                 change.
               - Check every new model appears in the module's `__all__` and is
                 referenced only after it is defined.
               - Check docstring changes name the right status codes, and that
                 method signatures match the params class they point at.

            2. **Consumer impact**
               - What breaks for someone upgrading: a removed or renamed import,
                 a field whose type or requiredness changed, a model that became
                 a union and now needs narrowing before attribute access.
               - Call out anything that type-checks today and fails after this,
                 and separately anything that keeps type-checking and changes
                 meaning - a renumbered union member is the second kind.

            Do not raise these on a regeneration PR:
               - The deterministic gates. A bot comment on the PR already
                 reports reproducibility, determinism, `ruff check`,
                 `ruff format`, params resolution, class ordering and deletion
                 safety. Read it, rely on it, and do not restate it. Mention it
                 only if it is missing or reports a failure.
               - `CHANGELOG.md` not being updated. release-please writes it at
                 release time.
               - `api.md` not being updated, unless a resource, a method or a
                 top-level exported type changed. It does not list nested
                 models.
               - Missing hand-written tests. `tests/api_resources/` is generated
                 too, and coverage for a new schema comes from the spec and the
                 generator; a real gap is a follow-up in
                 roarkhq/app-agent-codegen, not a blocker here.
               - `configured_endpoints` in `.stats.yml` moving without a method
                 change. It counts configured spec endpoints, not SDK methods;
                 cross-check the body's "Public surface" section instead of
                 treating the difference as drift.
               - Style, naming or structure of generated code as such. If the
                 output is genuinely wrong, say so and say the fix belongs in
                 the generator or the spec. Never ask for a hand edit to a
                 generated file.

            **B. Hand-written PR** - anything else: CI, scripts, packaging,
            `src/roark_analytics/lib/`, `examples/`, docs. Review it as ordinary
            code: correctness and edge cases, readability, credential and secret
            handling, test coverage for the behavior that changed, and the docs
            that have to move with it. Two repo-specific checks:
               - A hand edit to a generated path - anything under
                 `src/roark_analytics/` except `lib/`, or `tests/api_resources/`,
                 or `api.md` - is a finding, because the next regeneration
                 overwrites it. Per CONTRIBUTING.md only
                 `src/roark_analytics/lib/` and `examples/` are left alone by
                 the generator.
               - For workflow changes, check triggers and `if:` conditions
                 against the branch flow this repo uses: regeneration PRs target
                 `next`, `next` folds into `main`, and release-please opens
                 `release-please--*` PRs against `main`.

            Use inline comments for findings tied to a specific line. Keep them
            few and specific, and skip nits on generated code.

            Finish with one top-level summary comment in this format:

            ## Code Review Summary

            | Category | Score | Notes |
            |----------|-------|-------|
            | API surface & release metadata | X/5 | Brief note |
            | Consumer impact | X/5 | Brief note |
            | Code quality | X/5 | Brief note |
            | Security | X/5 | Brief note |
            | Testing | X/5 | Brief note |
            | Documentation | X/5 | Brief note |
            | **Overall** | **X/5** | |

            Scoring guide:
            - 0: Critical issues, must fix before merge
            - 1: Major issues that should be addressed
            - 2: Several concerns worth discussing
            - 3: Acceptable with minor suggestions
            - 4: Good quality with nitpicks only
            - 5: Excellent, no issues found

            Score a category `n/a` when the diff gives you nothing to judge it
            on, and leave it out of the overall score. Never score a category
            low for being out of scope in this repo. The overall score cannot
            exceed the API surface & release metadata score.

            Follow the table with:
            - one line on which kind of PR this is and what spec change appears
              to be behind it;
            - the breaking-change call: real removal, rename only, a union
              member renumbered under a surviving name, or none, and whether the
              commit metadata matches it;
            - what breaks for a consumer upgrading, or "nothing";
            - blocking findings, each with its file and line;
            - anything that belongs in roarkhq/app-agent-codegen instead, named
              as a follow-up there.
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*)"

  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}