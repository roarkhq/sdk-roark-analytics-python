name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  review:
    if: |
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # The review must be able to compare generated code with the complete
          # Stainless-authored history, not only with the current PR snapshot.
          fetch-depth: 0

      - name: PR Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a comprehensive review of this deterministic code generator.
            This repository replaces Stainless as the generator for our SDKs,
            CLI, and MCP server, but it does not contain the generated SDK commit
            history. Review whether source changes preserve the generator's
            compatibility guarantees; the generated output itself is reviewed
            separately in the destination SDK repositories.

            1. **Generator compatibility (highest priority; merge-blocking)**
               - Determine which parser, naming, emitter, apply, deletion,
                 public-surface, PR, or verification behavior the change affects.
               - Verify deterministic output: identical inputs must produce
                 byte-identical files, stable ordering, and no time-, locale-,
                 filesystem-, or network-dependent output.
               - Verify unsupported schemas fail explicitly instead of emitting
                 plausible but incorrect SDK types or methods.
               - Ensure runtime code is not regenerated, owned-directory
                 boundaries are respected, and files are changed only when their
                 generated bytes change.
               - Check that public API removals and renames are detected and
                 produce the correct breaking commit and PR metadata.
               - Inspect relevant tests, fixtures, snapshots, README rules, and
                 documented vendor divergences. Any output-shape change needs a
                 focused regression or parity test.
               - For Node changes, assess effects on SDK resources, pagination,
                 serialization, examples, and the MCP tool snapshot.
               - For CLI changes, assess command naming, flags, help output,
                 defaults, exit behavior, and the CLI command snapshot.
               - For Python changes, assess resource coverage, generated class
                 order, formatting, Ruff compatibility, and deletion safety.
               - Flag weakened gates, skipped verification, snapshot updates
                 without a justified behavior change, and tests altered merely
                 to accept new output.
               - Treat unexplained output drift, nondeterminism, accidental
                 deletion, public-surface misclassification, and missing
                 regression coverage as blocking findings.
               - Do not claim direct comparison with historical Stainless SDK
                 commits from this checkout. State when downstream generated PR
                 verification is required to establish actual output parity.

            2. **Code Quality**
               - Clean code principles and best practices
               - Proper error handling and edge cases
               - Code readability and maintainability

            3. **Security**
               - Check for potential security vulnerabilities
               - Validate input sanitization
               - Review authentication/authorization logic

            4. **Performance**
               - Identify potential performance bottlenecks
               - Review database queries for efficiency
               - Check for memory leaks or resource issues

            5. **Testing**
               - Verify adequate test coverage
               - Review test quality and edge cases
               - Check for missing test scenarios

            6. **Documentation**
               - Ensure code is properly documented
               - Verify README updates for new features
               - Check API documentation accuracy

            Provide detailed feedback using inline comments for specific issues.

            After reviewing, post a top-level summary comment on the PR with the following format:

            ## Code Review Summary

            | Category | Score | Notes |
            |----------|-------|-------|
            | Generator Compatibility | X/5 | Brief note |
            | Code Quality | X/5 | Brief note |
            | Security | X/5 | Brief note |
            | Performance | X/5 | Brief note |
            | Testing | X/5 | Brief note |
            | Documentation | X/5 | Brief note |
            | **Overall** | **X/5** | |

            Scoring guide:
            - 0: Critical issues, must fix before merge
            - 1: Major issues that should be addressed
            - 2: Several concerns worth discussing
            - 3: Acceptable with minor suggestions
            - 4: Good quality with nitpicks only
            - 5: Excellent, no issues found

            The overall score cannot exceed the Generator Compatibility score. Follow
            the score table with:
            - the generator rules, tests, fixtures, and snapshots consulted;
            - expected effects on Node, Python, CLI, MCP, and docs output;
            - intentional compatibility changes versus unexplained drift;
            - blocking findings and missing regression tests;
            - downstream generated PR checks needed to prove output parity;
            - a brief list of other key findings.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*)"

  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}