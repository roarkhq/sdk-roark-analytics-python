# This workflow is triggered when a GitHub release is created.
# It can also be run manually to re-publish to PyPI in case it failed for some reason.
# You can run this workflow by navigating to https://www.github.com/roarkhq/sdk-roark-analytics-python/actions/workflows/publish-pypi.yml
name: Publish PyPI
on:
  workflow_dispatch:

  release:
    types: [published]


jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Install Rye
        run: |
          curl -sSf https://rye.astral.sh/get | bash
          echo "$HOME/.rye/shims" >> $GITHUB_PATH
        env:
          RYE_VERSION: '0.44.0'
          RYE_INSTALL_OPTION: '--yes'

      - name: Publish to PyPI
        run: |
          bash ./bin/publish-pypi
        env:
          PYPI_TOKEN: ${{ secrets.ROARK_PYPI_TOKEN || secrets.PYPI_TOKEN }}

      # Post the outcome to #alarms-prod. No-op until the SLACK_ALARMS_PROD_WEBHOOK_URL org
      # secret is set; jq builds the payload so message text cannot break it.
      - name: Slack notify - published
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALARMS_PROD_WEBHOOK_URL }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          [ -n "${SLACK_WEBHOOK_URL:-}" ] || { echo 'SLACK_ALARMS_PROD_WEBHOOK_URL unset; skipping'; exit 0; }
          text="📦 \`roark_analytics\` ${VERSION:-(new version)} published to PyPI"
          resp=$(curl -sS --max-time 15 -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg t "$text" '{text:$t}')" "$SLACK_WEBHOOK_URL") \
            || { echo '::warning::Slack request failed (transport or timeout); alert not delivered'; exit 0; }
          # Best-effort, but not silent: a non-"ok" webhook response surfaces as a
          # warning rather than vanishing.
          [ "$resp" = ok ] || echo "::warning::Slack webhook did not accept the alert: $resp"

      - name: Slack notify - publish failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALARMS_PROD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "${SLACK_WEBHOOK_URL:-}" ] || { echo 'SLACK_ALARMS_PROD_WEBHOOK_URL unset; skipping'; exit 0; }
          text="🚨 \`roark_analytics\` publish FAILED - ${RUN_URL}"
          resp=$(curl -sS --max-time 15 -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg t "$text" '{text:$t}')" "$SLACK_WEBHOOK_URL") \
            || { echo '::warning::Slack request failed (transport or timeout); alert not delivered'; exit 0; }
          # Best-effort, but not silent: a non-"ok" webhook response surfaces as a
          # warning rather than vanishing.
          [ "$resp" = ok ] || echo "::warning::Slack webhook did not accept the alert: $resp"
